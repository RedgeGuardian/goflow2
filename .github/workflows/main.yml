name: Main

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
      # Full history ensures tag-aware versioning for release builds.
      with:
        fetch-depth: 0

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.24
        cache: true
        cache-dependency-path: |
          go.sum
          go.mod

    - name: Tidy Go Modules
      run: go mod tidy

    - name: Install linters
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Test
      run: make test

    - name: Vet
      run: make vet

    - name: Test (race)
      continue-on-error: true
      run: make test-race

    - name: Test (coverage)
      continue-on-error: true
      run: make test-cover

    - name: Lint (golangci-lint)
      continue-on-error: true
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

    - name: Staticcheck
      continue-on-error: true
      run: make staticcheck

  build:
    name: Build (linux-amd64)
    needs: test
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
      # Fetch tags so release builds can resolve VERSION.
      with:
        fetch-depth: 0

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.24
        cache: true
        cache-dependency-path: |
          go.sum
          go.mod

    - name: Set VERSION for tag builds
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "VERSION=$(git describe --tags --abbrev=0 HEAD)" >> "$GITHUB_ENV"

    - name: Build
      run: make build

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist-linux-amd64
        path: dist/*
        retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - name: Create Release
      id: create_release
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const tag = process.env.GITHUB_REF_NAME;
          const { data } = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tag,
            name: `Release ${tag}`,
            draft: false,
            prerelease: false,
          });
          core.setOutput('upload_url', data.upload_url);

    - name: Upload Release Asset
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs').promises;
          const path = require('path');
          const uploadUrl = '${{ steps.create_release.outputs.upload_url }}';
          for (const file of await fs.readdir('./dist')) {
            console.log('uploading', file);
            await github.rest.repos.uploadReleaseAsset({
              url: uploadUrl,
              name: file,
              data: await fs.readFile(path.join('dist', file)),
            });
          }
