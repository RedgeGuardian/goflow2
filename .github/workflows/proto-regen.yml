name: Regenerate Protobuf

# push = regenerate when a .proto changes; workflow_dispatch = manual run, e.g. after a protoc-gen-go update.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pb/**/*.proto"
      - "cmd/enricher/pb/**/*.proto"

permissions:
  contents: write

concurrency:
  group: proto-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ^1.24
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate protobuf
        run: make proto

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build regenerated code
        if: steps.diff.outputs.changed == 'true'
        run: go build ./...

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb/ cmd/enricher/pb/
          git commit -m "chore(proto): regenerate protobuf"
          git push origin HEAD:main
